; Managed by aio-mothership setup/08-apache-php.sh (M-038). Do not edit here.
; Dashboard pool (443). Runs as its own system user, so later only this pool
; can read the dashboard database credentials (MS-SEC-04).
[aio-dashboard]
user = aio-dashboard
group = aio-dashboard
listen = /run/php/aio-dashboard.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 1000
request_terminate_timeout = 60s

security.limit_extensions = .php
catch_workers_output = yes
clear_env = yes

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 2M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[max_execution_time] = 30
; Session cookies: Secure, HttpOnly, SameSite (MS-SEC-05).
php_admin_value[session.save_path] = /var/lib/php/sessions-aio-dashboard
php_admin_flag[session.cookie_secure] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.cookie_samesite] = Strict
php_admin_flag[session.use_strict_mode] = on
php_admin_flag[session.use_only_cookies] = on
; Ubuntu's sessionclean job only cleans the default directory, so PHP's own
; clean-up runs here: about 1 request in 100 removes sessions older than
; 12 h, the longest a dashboard session lasts (M-054).
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_value[session.gc_maxlifetime] = 43200
