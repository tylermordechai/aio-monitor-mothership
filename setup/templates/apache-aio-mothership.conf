# Managed by aio-mothership setup/08-apache-php.sh (M-038). Do not edit here.
# Server-wide settings for both vhosts.
ServerName @AIO_IP@
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

# TLS: session tickets off (forward secrecy); no compression, no renegotiation
# by the client.
SSLSessionTickets Off
SSLCompression Off
SSLInsecureRenegotiation Off
SSLUseStapling Off

# Access log with the TLS version and, on 8443, the client certificate result.
# No request bodies are ever logged; tokens travel only in bodies (MS-SEC-10).
LogFormat "%a %t \"%r\" %>s %b %D \"%{User-Agent}i\" %{SSL_PROTOCOL}x %{SSL_CLIENT_VERIFY}x %{SSL_CLIENT_S_DN_CN}x" aio_tls

<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>
