# Managed by aio-mothership setup/08-apache-php.sh (M-038). Do not edit here.
# Dashboard on 443: TLS 1.2 or 1.3 for browsers (MS-SEC-01, M-019), server
# certificate from the web CA (M-024). No client certificates.
<VirtualHost *:443>
    ServerName @AIO_IP@
    DocumentRoot @AIO_REPO@/public/dashboard

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    # ECDSA key: ECDHE with AEAD ciphers only for TLS 1.2.
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    SSLCertificateFile    /etc/aio-mothership/pki/server/dashboard.crt
    SSLCertificateKeyFile /etc/aio-mothership/pki/server/dashboard.key
    SSLVerifyClient none

    LimitRequestBody 2097152

    <Directory @AIO_REPO@/public/dashboard>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SSLOptions +StdEnvVars
        SetHandler "proxy:unix:/run/php/aio-dashboard.sock|fcgi://aio-dashboard/"
    </FilesMatch>

    # Strict defaults while only the health page exists; milestone 5 sets the
    # dashboard's own policy (MS-SEC-05).
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
    Header always set Cache-Control "no-store"

    ErrorLog  ${APACHE_LOG_DIR}/aio-dashboard.error.log
    CustomLog ${APACHE_LOG_DIR}/aio-dashboard.access.log aio_tls
</VirtualHost>
