; /etc/aio-mothership/app.ini: settings for the mothership's PHP code.
; Written once by setup/09-app.sh and never overwritten, so local changes stay.
; Every value here is the built-in default (src/Config.php); delete a line to
; go back to it. No secrets here: database passwords are in db/*.cnf.

[ingest]
; ingest-api.md §3.1 limits (M-017).
max_compressed_bytes = 10485760
max_raw_bytes = 67108864
max_lines = 50000
max_line_bytes = 1048576
; §9: record types quarantined as "provisional type, no table yet", comma-separated.
provisional_record_types = ""
; §8.2 back-pressure (M-009): concurrent ingest requests, and per agent.
max_concurrent = 12
agent_max_rps = 5
agent_rate_window_s = 10
; MS-OPS-08: answer 503 storage_full at this disk use.
disk_full_percent = 90

[heartbeat]
interval_s = 60
