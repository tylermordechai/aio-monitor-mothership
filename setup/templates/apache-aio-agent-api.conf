# Managed by aio-mothership setup/08-apache-php.sh (M-038). Do not edit here.
# Agent API on 8443: TLS 1.3 only (M-019); a client certificate from the agent
# CA is requested on every connection, "optional" so /api/v1/enroll works
# without one (M-001). PHP enforces the certificate on every other path.
# Agents connect by IP, so there is no SNI: this is the only vhost on 8443.
<VirtualHost *:8443>
    ServerName @AIO_IP@
    DocumentRoot @AIO_REPO@/public/agent

    SSLEngine on
    SSLProtocol -all +TLSv1.3
    SSLCertificateFile    /etc/aio-mothership/pki/server/agent-api.crt
    SSLCertificateKeyFile /etc/aio-mothership/pki/server/agent-api.key
    SSLCACertificateFile  /etc/aio-mothership/pki/public/agent-ca.crt
    SSLVerifyClient optional
    SSLVerifyDepth 1
    # The agent CA's CRL (M-071): the file exists once 11-enrolment.sh has
    # built the first CRL, so a new server starts without it.
    IncludeOptional /etc/aio-mothership/apache/agent-crl.conf

    # 10 MB compressed batch limit (MS-ING-01) plus headroom; PHP checks the
    # exact limit and answers 413 itself.
    LimitRequestBody 11534336

    <Directory @AIO_REPO@/public/agent>
        Options None
        AllowOverride None
        Require all granted
        # /api/v1/* is not a file: the front controller answers it, and any
        # unknown path, with the JSON errors of ingest-api.md §7 (M-048).
        FallbackResource /index.php
    </Directory>

    <FilesMatch "\.php$">
        SSLOptions +StdEnvVars +ExportCertData
        SetHandler "proxy:unix:/run/php/aio-ingest.sock|fcgi://aio-ingest/"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Cache-Control "no-store"

    ErrorLog  ${APACHE_LOG_DIR}/aio-agent-api.error.log
    CustomLog ${APACHE_LOG_DIR}/aio-agent-api.access.log aio_tls
</VirtualHost>
