; Managed by aio-mothership setup/08-apache-php.sh (M-038). Do not edit here.
; Agent API pool (8443). Runs as its own system user, so later only this pool
; can read the ingest database credentials (MS-SEC-04).
[aio-ingest]
user = aio-ingest
group = aio-ingest
listen = /run/php/aio-ingest.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Sized for milestone 1; the milestone 2 load test (50 requests/s) tunes it.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
request_terminate_timeout = 60s

security.limit_extensions = .php
catch_workers_output = yes
clear_env = yes

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[post_max_size] = 11M
php_admin_value[upload_max_filesize] = 11M
php_admin_value[max_execution_time] = 55
